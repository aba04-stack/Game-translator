name: Import RPGMTL payload
on:
  push:
    branches:
      - import/rpgmtl-v5-payload
    paths:
      - ".payload/READY"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Checkout upload payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: payload
          persist-credentials: false
      - name: Extract and commit project
        shell: bash
        run: |
          set -euo pipefail
          cat payload/.payload/chunk-* > /tmp/rpgmtl.tar.gz.b64
          base64 --decode /tmp/rpgmtl.tar.gz.b64 > /tmp/rpgmtl.tar.gz
          tar -tzf /tmp/rpgmtl.tar.gz >/dev/null
          mkdir -p /tmp/rpgmtl-unpacked
          tar -xzf /tmp/rpgmtl.tar.gz -C /tmp/rpgmtl-unpacked --strip-components=1
          test -f /tmp/rpgmtl-unpacked/run.py
          test -d /tmp/rpgmtl-unpacked/engine
          find /tmp/rpgmtl-unpacked -type f -print0 | while IFS= read -r -d '' src; do
            rel="${src#/tmp/rpgmtl-unpacked/}"
            mkdir -p "repo/$(dirname "$rel")"
            cp "$src" "repo/$rel"
          done
          rm -f repo/.github/workflows/import-rpgmtl-payload.yml
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import RPGMTL v5.0 game translator"
          git push origin HEAD:main
