name: Import RPGMTL archive
on:
  push:
    branches:
      - main
    paths:
      - "RPGMTL_v5_0_fixed.tar.gz"
permissions:
  contents: write
jobs:
  unpack-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and unpack archive
        shell: bash
        run: |
          set -euo pipefail
          test -f RPGMTL_v5_0_fixed.tar.gz
          tar -tzf RPGMTL_v5_0_fixed.tar.gz >/dev/null
          mkdir -p /tmp/rpgmtl-unpacked
          tar -xzf RPGMTL_v5_0_fixed.tar.gz -C /tmp/rpgmtl-unpacked --strip-components=1
          test -f /tmp/rpgmtl-unpacked/run.py
          test -d /tmp/rpgmtl-unpacked/engine
          find /tmp/rpgmtl-unpacked -type f -print0 | while IFS= read -r -d '' src; do
            rel="${src#/tmp/rpgmtl-unpacked/}"
            mkdir -p "$(dirname "$rel")"
            cp "$src" "$rel"
          done
          rm -f RPGMTL_v5_0_fixed.tar.gz .github/workflows/import-rpgmtl-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes found."
            exit 1
          fi
          git commit -m "Import RPGMTL v5.0 game translator"
          git push origin HEAD:main
