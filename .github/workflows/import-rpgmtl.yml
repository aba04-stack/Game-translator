name: Import RPGMTL source archive

on:
  push:
    branches: [main]
    paths:
      - "_rpgmtl_import/part-*.b64"

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rebuild and extract the verified source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rpgmtl-source
          cat _rpgmtl_import/part-*.b64 | base64 --decode > /tmp/RPGMTL_v5_0_fixed.tar.gz
          tar -tzf /tmp/RPGMTL_v5_0_fixed.tar.gz > /tmp/rpgmtl-members.txt
          if grep -E '(^/|(^|/)\.\.(\/|$))' /tmp/rpgmtl-members.txt; then
            echo "Unsafe archive path detected; refusing extraction."
            exit 1
          fi
          tar -xzf /tmp/RPGMTL_v5_0_fixed.tar.gz -C /tmp/rpgmtl-source --no-same-owner
          cp -a /tmp/rpgmtl-source/. .
          rm -rf _rpgmtl_import
          rm -f _tree_content_test.txt _connection_check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted source changes to commit."
            exit 0
          fi
          git commit -m "feat: import RPGMTL v5.0 game translator source"
          git push
