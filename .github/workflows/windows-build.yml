name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build one-file Windows executable
        run: build_exe.bat
        shell: cmd
        env:
          CI: "true"

      - name: Verify executable and write checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist/PatchLingo.exe"
          if ($exe.Length -lt 1MB) {
            throw "The packaged executable is unexpectedly small ($($exe.Length) bytes)."
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  PatchLingo.exe" | Set-Content "dist/PatchLingo.exe.sha256" -Encoding ascii
          Write-Host "Built $($exe.Length) bytes; SHA-256 $hash"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PatchLingo-Windows
          path: |
            dist/PatchLingo.exe
            dist/PatchLingo.exe.sha256
          if-no-files-found: error
          retention-days: 14
