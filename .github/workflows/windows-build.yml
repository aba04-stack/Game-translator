name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ICO resource
        shell: pwsh
        run: |
          $icon = [System.IO.File]::ReadAllBytes("icon.ico")
          if ($icon.Length -lt 1024) { throw "icon.ico is unexpectedly small ($($icon.Length) bytes)." }
          if ($icon[0] -ne 0 -or $icon[1] -ne 0 -or $icon[2] -ne 1 -or $icon[3] -ne 0) {
            throw "icon.ico has an invalid ICO header."
          }
          $count = [System.BitConverter]::ToUInt16($icon, 4)
          if ($count -lt 1) { throw "icon.ico contains no images." }
          $directoryEnd = 6 + 16 * $count
          if ($directoryEnd -gt $icon.Length) { throw "icon.ico directory is truncated." }
          for ($i = 0; $i -lt $count; $i++) {
            $entry = 6 + 16 * $i
            $size = [System.BitConverter]::ToUInt32($icon, $entry + 8)
            $offset = [System.BitConverter]::ToUInt32($icon, $entry + 12)
            if ($size -lt 1 -or $offset -lt $directoryEnd -or ($offset + $size) -gt $icon.Length) {
              throw "icon.ico image entry $i points outside the file."
            }
          }
          Write-Host "ICO valid: $count image(s), $($icon.Length) bytes."

      - name: Build one-file Windows executable
        run: build_exe.bat
        shell: cmd
        env:
          CI: "true"

      - name: Verify portable app and write checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist/PatchLingo.exe"
          if ($exe.Length -lt 1MB) {
            throw "The packaged executable is unexpectedly small ($($exe.Length) bytes)."
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  PatchLingo.exe" | Set-Content "dist/PatchLingo.exe.sha256" -Encoding ascii
          Write-Host "Built portable app: $($exe.Length) bytes; SHA-256 $hash"

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --yes --no-progress
        shell: pwsh

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler /Qp /O"dist" "packaging\PatchLingo.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer and install it in a temporary folder
        shell: pwsh
        run: |
          $setup = Get-Item "dist/PatchLingo-Setup.exe"
          if ($setup.Length -lt 1MB) {
            throw "The installer is unexpectedly small ($($setup.Length) bytes)."
          }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          "$hash  PatchLingo-Setup.exe" | Set-Content "dist/PatchLingo-Setup.exe.sha256" -Encoding ascii

          $installDir = Join-Path $env:RUNNER_TEMP "PatchLingo-Smoke"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir")
          $install = Start-Process -FilePath $setup.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "The installer returned exit code $($install.ExitCode)."
          }

          $installedExe = Join-Path $installDir "PatchLingo.exe"
          if (-not (Test-Path $installedExe)) {
            throw "The installer did not place PatchLingo.exe in $installDir."
          }

          Get-Process -Name "PatchLingo" -ErrorAction SilentlyContinue | Stop-Process -Force
          $startTime = Get-Date
          $app = Start-Process -FilePath $installedExe -WorkingDirectory $installDir -PassThru
          try {
            $visibleWindows = @()
            for ($attempt = 0; $attempt -lt 15; $attempt++) {
              Start-Sleep -Seconds 1
              $processes = Get-Process -Name "PatchLingo" -ErrorAction SilentlyContinue |
                Where-Object { $_.StartTime -ge $startTime }
              $visibleWindows = @($processes | Where-Object {
                $_.MainWindowHandle -ne [IntPtr]::Zero -and $_.MainWindowTitle
              })
              if ($visibleWindows.Count -gt 0) { break }
            }
            if ($visibleWindows.Count -eq 0) {
              throw "PatchLingo stayed in the process list but did not expose a main window."
            }
            Write-Host "Visible PatchLingo window: $($visibleWindows[0].MainWindowTitle)"
          }
          finally {
            Get-Process -Name "PatchLingo" -ErrorAction SilentlyContinue | Stop-Process -Force
          }

          Write-Host "Built installer: $($setup.Length) bytes; SHA-256 $hash"

      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: PatchLingo-Windows
          path: |
            dist/PatchLingo.exe
            dist/PatchLingo.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PatchLingo-Setup
          path: |
            dist/PatchLingo-Setup.exe
            dist/PatchLingo-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
