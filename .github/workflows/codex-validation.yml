name: Temporary repository validation

on:
  push:
    branches:
      - codex/ci-check-20261025

permissions:
  contents: read

jobs:
  tests-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests -q
      - name: Check Python files with pyflakes
        run: python -m pyflakes $(git ls-files '*.py' | grep -v '^tests/')
